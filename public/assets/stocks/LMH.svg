<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="lmh-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a4d42" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2a4d42" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lmh-mint-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be0ab" />
      <stop offset="50%" stop-color="#4f9d6e" />
      <stop offset="100%" stop-color="#2e6b47" />
    </linearGradient>
    <linearGradient id="lmh-glass-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5faf8" />
      <stop offset="55%" stop-color="#d5e4e0" />
      <stop offset="100%" stop-color="#a5bab5" />
    </linearGradient>
    <radialGradient id="lmh-cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72fbee" stop-opacity="0.65" />
      <stop offset="65%" stop-color="#4fd8cc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4fd8cc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lmh-droplet" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#b8fff9" />
      <stop offset="45%" stop-color="#6ae8de" />
      <stop offset="85%" stop-color="#46b5b0" />
      <stop offset="100%" stop-color="#2e7d7b" />
    </radialGradient>
  </defs>

  <rect width="256" height="256" fill="#FFFFFF" />
  <ellipse cx="128" cy="234" rx="52" ry="6" fill="url(#lmh-shadow)" />

  <!-- 4 Mint Green Capsule Dome Ends -->
  <!-- Top Cap -->
  <rect x="95" y="28" width="66" height="54" rx="33" fill="url(#lmh-mint-cap)" />
  <rect x="95" y="42" width="66" height="14" rx="4" fill="#eef4f1" />
  <rect x="95" y="54" width="66" height="18" rx="4" fill="url(#lmh-mint-cap)" />

  <!-- Bottom Cap -->
  <rect x="95" y="174" width="66" height="54" rx="33" fill="url(#lmh-mint-cap)" />
  <rect x="95" y="200" width="66" height="14" rx="4" fill="#dce5e1" />
  <rect x="95" y="184" width="66" height="18" rx="4" fill="url(#lmh-mint-cap)" />

  <!-- Left Cap -->
  <rect x="28" y="95" width="54" height="66" rx="33" fill="url(#lmh-mint-cap)" />
  <rect x="42" y="95" width="14" height="66" rx="4" fill="#eef4f1" />
  <rect x="54" y="95" width="18" height="66" rx="4" fill="url(#lmh-mint-cap)" />

  <!-- Right Cap -->
  <rect x="174" y="95" width="54" height="66" rx="33" fill="url(#lmh-mint-cap)" />
  <rect x="200" y="95" width="14" height="66" rx="4" fill="#dce5e1" />
  <rect x="184" y="95" width="18" height="66" rx="4" fill="url(#lmh-mint-cap)" />

  <!-- Central Frosted Milk-Glass Cross Body -->
  <path d="M95,70 L161,70 L161,83 Q161,95 173,95 L186,95 L186,161 L173,161 Q161,161 161,173 L161,186 L95,186 L95,173 Q95,161 83,161 L70,161 L70,95 L83,95 Q95,95 95,83 Z" fill="url(#lmh-glass-body)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Subsurface Scattering Cyan Glow -->
  <circle cx="128" cy="128" r="46" fill="url(#lmh-cyan-glow)" />

  <!-- Central Glowing Droplet Lens with Ceramic Frame -->
  <path d="M128,88 C142,104 156,120 156,136 C156,152 143.5,164 128,164 C112.5,164 100,152 100,136 C100,120 114,104 128,88 Z" fill="#e8f2ef" stroke="#b6ccc7" stroke-width="2" />
  <path d="M128,95 C140,109 150,122 150,136 C150,149 140,158 128,158 C116,158 106,149 106,136 C106,122 116,109 128,95 Z" fill="url(#lmh-droplet)" />

  <!-- Specular Lens Reflection -->
  <ellipse cx="120" cy="122" rx="7" ry="12" transform="rotate(-22 120 122)" fill="#ffffff" fill-opacity="0.65" />
</svg>
